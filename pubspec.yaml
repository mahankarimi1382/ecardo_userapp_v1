name: ecardo_user
description: "eCardo — International Financial Super App for users (multi-currency wallet, cards, transfers, remittance, travel, P2P, bill payments)."
publish_to: 'none'

version: 1.0.87+87

environment:
  sdk: ^3.9.2
#  Flutter version 3.44.6
#  Dart version 3.12.2

dependencies:
  open_filex: ^4.5.2
  package_info_plus: ^8.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.7.2
  pin_code_fields: ^8.0.1
  fluttertoast: ^9.0.0
  flutter_rounded_date_picker: ^3.0.4
  calendar_date_picker2: ^3.0.0
  shamsi_date: ^1.1.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  file_picker: ^10.3.3
  animated_bottom_navigation_bar: ^1.4.0
  dio: ^5.9.0
  loading_animation_widget: ^1.3.0
  flutter_svg: ^2.2.1
  permission_handler: ^12.0.1
  flutter_widget_from_html: ^0.17.1
  webview_flutter: ^4.13.0
  mobile_scanner: ^7.1.3
  share_plus: ^12.0.1
  cross_file: ^0.3.4+2
  local_auth: ^3.0.0
  crypto: ^3.0.3
  android_intent_plus: ^6.0.0
  camerawesome: ^2.5.0
  flutter_screenutil: ^5.9.3
  shimmer: ^3.0.0
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.5.0
  device_info_plus: ^12.2.0
  connectivity_plus: ^7.0.0
  lottie: ^3.3.2
  path_provider: ^2.1.5
  barcode: ^2.2.9
  printing: ^5.14.2
  pdf: ^3.11.3
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.2
  animations: ^2.2.0

dev_dependencies:
  change_app_package_name: ^1.5.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/logos/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/logos/app_icon_adaptive_fg.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/others/frame/
    - assets/images/welcome/
    - assets/icons/png/auth/
    - assets/icons/png/bottom_navigation/
    - assets/icons/png/bottom_navigation/raw/
    - assets/icons/png/bottom_navigation/solid/
    - assets/icons/png/common/
    - assets/images/avatar/
    - assets/icons/png/others/
    - assets/icons/svg/drawer/
    - assets/icons/png/end_drawer/
    - assets/images/referral/
    - assets/images/utils/
    - assets/icons/png/transactions/
    - assets/icons/svg/common/
    - assets/icons/png/notifications/
    - assets/icons/png/services/
    - assets/others/json/

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
    - family: NotoSansRU
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
