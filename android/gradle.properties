# phase3-fix: right-sized for CI runners and faster local builds
# (audit A10-P2-17). Jetifier is obsolete with the current AndroidX-only
# dependency set; incremental Kotlin is safe and much faster.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
kotlin.incremental=true
