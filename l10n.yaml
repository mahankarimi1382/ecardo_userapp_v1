arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
# Generate into lib/l10n/ (overwriting the checked-in files) instead of
# the default synthetic package under .dart_tool/flutter_gen/. This keeps
# the imports in user code (`import 'package:ecardo_user/l10n/...';`)
# pointing at the regenerated files, so new .arb keys become available
# to the build immediately after `flutter gen-l10n` runs in CI.
synthetic-package: false
output-dir: lib/l10n
