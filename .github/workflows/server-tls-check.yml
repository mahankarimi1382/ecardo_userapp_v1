name: Server TLS Check

# Probe for the notify target the release pipeline depends on.
# ecardo.ir is the SAME fronted domain the app itself uses
# (lib/src/network/api/api_path.dart → https://ecardo.ir/api), so a
# green run here means the deploy-webhook notify step can reach the
# server on the next tagged release. Harmless by design — a public GET
# of the app-version endpoint, no secrets, no side effects.

on:
  workflow_dispatch:

jobs:
  tls-check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ecardo.ir TLS chain (no -k)
        run: |
          set -o pipefail
          if curl --fail-with-body --show-error --silent \
            https://ecardo.ir/api/app-version \
            | tee tls-result.txt; then
            grep -q '"version"' tls-result.txt \
              && echo "✅ TLS chain is publicly verifiable AND the API answered."
            || { echo "❌ TLS OK but unexpected response body — see tls-result.txt"; exit 1; }
          else
            code=$?
            if [ "$code" -eq 60 ] || grep -qi "SSL certificate problem" tls-result.txt; then
              echo "❌ TLS CHAIN UNVERIFIABLE on ecardo.ir (curl exit 60) — the"
              echo "   app-facing domain must always serve a publicly-trusted chain."
              exit 1
            fi
            echo "❌ Probe failed (curl exit $code) — see tls-result.txt"
            exit 1
          fi
