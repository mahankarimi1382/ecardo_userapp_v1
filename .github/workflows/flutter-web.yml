name: Flutter Web Build (eCardo)

on:
  push:
    branches:
      - feature/kyc-multicountry-badge
  workflow_dispatch:
    inputs:
      base_href:
        description: 'Base href for web build'
        required: false
        default: '/web-app/'
        type: string
      renderer:
        description: 'Web renderer (canvaskit | html | auto)'
        required: false
        default: 'canvaskit'
        type: choice
        options:
          - canvaskit
          - html
          - auto

jobs:
  build-web:
    name: Build Flutter Web (release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          cache: true
          channel: "stable"

      - name: Enable Web + Generate web scaffold
        run: |
          flutter config --enable-web
          # Generate web scaffold (overwrites any partial web/ with proper Flutter template)
          flutter create . --platforms=web --project-name=qunzo_user --org=com.ecardo
          ls -la web/

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Prepare web manifest / icons / theme
        run: |
          set -e
          # Copy iOS 1024 icon to PWA sizes. Browsers will downscale.
          SRC="ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png"
          if [ -f "$SRC" ]; then
            mkdir -p web/icons
            cp "$SRC" web/icons/Icon-192.png
            cp "$SRC" web/icons/Icon-512.png
            cp "$SRC" web/icons/Icon-maskable-192.png
            cp "$SRC" web/icons/Icon-maskable-512.png
            cp "$SRC" web/favicon.png
            ls -la web/icons/ web/favicon.png
          fi

          # Override manifest.json with eCardo-specific metadata
          cat > web/manifest.json <<'JSON'
          {
              "name": "eCardo Wallet",
              "short_name": "eCardo",
              "start_url": ".",
              "display": "standalone",
              "background_color": "#7445FF",
              "theme_color": "#7445FF",
              "description": "eCardo Multi-Country Digital Wallet - کیف پول دیجیتال چندکشوری ای‌کاردو",
              "orientation": "portrait-primary",
              "prefer_related_applications": [
                  {
                      "platform": "play",
                      "url": "https://ecardo.ir/apk/user/user-release.apk"
                  }
              ],
              "icons": [
                  { "src": "icons/Icon-192.png", "sizes": "192x192", "type": "image/png" },
                  { "src": "icons/Icon-512.png", "sizes": "512x512", "type": "image/png" },
                  { "src": "icons/Icon-maskable-192.png", "sizes": "192x192", "type": "image/png", "purpose": "maskable" },
                  { "src": "icons/Icon-maskable-512.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable" }
              ]
          }
          JSON

          # Make sure index.html description is also correct
          if grep -q '<meta name="description"' web/index.html; then
            sed -i 's|<meta name="description"[^>]*>|<meta name="description" content="eCardo Multi-Country Digital Wallet">|' web/index.html
          fi
          # Title
          sed -i 's|<title>.*</title>|<title>eCardo Wallet</title>|' web/index.html

      - name: Analyze
        run: flutter analyze 2>&1 | tee analyze.txt || true

      - name: Build Web (release)
        run: |
          BASE_HREF="${{ inputs.base_href || '/web-app/' }}"
          RENDERER="${{ inputs.renderer || 'canvaskit' }}"
          echo "Building web with base-href=$BASE_HREF renderer=$RENDERER"
          flutter build web --release \
            --base-href "$BASE_HREF" \
            --web-renderer "$RENDERER" \
            --no-tree-shake-icons
          echo "Build output:"
          ls -la build/web/
          echo "main.dart.js size:"
          ls -la build/web/main.dart.js

      - name: Create downloadable ZIP
        run: |
          cd build/web
          zip -r9 ../../web-build.zip .
          cd ../..
          ls -la web-build.zip

      - name: Upload Web Build (directory)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Web Build (zip)
        uses: actions/upload-artifact@v4
        with:
          name: web-build-zip
          path: web-build.zip
          if-no-files-found: error
          retention-days: 30
