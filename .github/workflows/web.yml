name: web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Web (release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Enable Web
        run: flutter config --enable-web

      - name: Regenerate web scaffold
        run: |
          if [ ! -f "web/index.html" ]; then
            flutter create . --platforms=web --project-name=ecardo_user --org=com.ecardo
          else
            flutter create . --platforms=web --project-name=ecardo_user --org=com.ecardo 2>&1 | tail -5 || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Web (release)
        run: |
          flutter build web --release --base-href "/web-app/" --no-tree-shake-icons
          ls -la build/web/

      - name: Prepare PWA manifest
        run: |
          SRC="ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png"
          if [ -f "$SRC" ]; then
            mkdir -p build/web/icons
            cp "$SRC" build/web/icons/Icon-192.png
            cp "$SRC" build/web/icons/Icon-512.png
            cp "$SRC" build/web/icons/Icon-maskable-192.png
            cp "$SRC" build/web/icons/Icon-maskable-512.png
            cp "$SRC" build/web/favicon.png
          fi
          cat > build/web/manifest.json <<'JSON'
          {
            "name": "eCardo Wallet",
            "short_name": "eCardo",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#7445FF",
            "theme_color": "#7445FF",
            "description": "eCardo Multi-Country Digital Wallet",
            "icons": [
              { "src": "icons/Icon-192.png", "sizes": "192x192", "type": "image/png" },
              { "src": "icons/Icon-512.png", "sizes": "512x512", "type": "image/png" }
            ]
          }
          JSON

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          if-no-files-found: error

      # Deploy: push build to 'web-deploy' orphan branch
      # Server pulls this branch to public/web-app/
      - name: Deploy to web-deploy branch
        run: |
          cd build/web
          git init
          git config user.email "ecardo-dev@ecardo.ir"
          git config user.name "eCardo Web Deploy"
          git checkout -b web-deploy
          git add -A
          git commit -m "web build $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/mahankarimi1382/ecardo_userapp_v1.git"
          git push origin web-deploy --force
          echo "Pushed to web-deploy branch"
