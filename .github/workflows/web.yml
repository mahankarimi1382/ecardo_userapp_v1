name: web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Web (release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Enable Web
        run: flutter config --enable-web

      - name: Backup custom web files
        run: |
          mkdir -p /tmp/web-backup
          if [ -f "web/index.html" ]; then
            cp web/index.html /tmp/web-backup/
            cp web/manifest.json /tmp/web-backup/ 2>/dev/null || true
            cp -r web/icons /tmp/web-backup/ 2>/dev/null || true
            echo "Custom web files backed up"
          fi

      - name: Ensure web scaffold
        run: |
          flutter create . --platforms=web --project-name=ecardo_user --org=com.ecardo 2>&1 | tail -5 || true

      - name: Restore custom web files
        run: |
          if [ -f "/tmp/web-backup/index.html" ]; then
            cp /tmp/web-backup/index.html web/index.html
            cp /tmp/web-backup/manifest.json web/manifest.json 2>/dev/null || true
            mkdir -p web/icons
            cp /tmp/web-backup/icons/* web/icons/ 2>/dev/null || true
            echo "Custom web files restored"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Web (release)
        run: |
          flutter build web --release --base-href "/web-app/" --no-tree-shake-icons
          ls -la build/web/

      - name: Prepare PWA icons + manifest
        run: |
          SRC="ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png"
          if [ -f "$SRC" ]; then
            mkdir -p build/web/icons
            cp "$SRC" build/web/icons/Icon-192.png
            cp "$SRC" build/web/icons/Icon-512.png
            cp "$SRC" build/web/icons/Icon-maskable-192.png
            cp "$SRC" build/web/icons/Icon-maskable-512.png
            cp "$SRC" build/web/favicon.png
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          if-no-files-found: error

      # Deploy: push build to 'web-deploy' orphan branch
      - name: Deploy to web-deploy branch
        run: |
          cd build/web
          git init
          git config user.email "ecardo-dev@ecardo.ir"
          git config user.name "eCardo Web Deploy"
          git checkout -b web-deploy
          git add -A
          git commit -m "web build $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/mahankarimi1382/ecardo_userapp_v1.git"
          git push origin web-deploy --force
          echo "Pushed to web-deploy branch"
