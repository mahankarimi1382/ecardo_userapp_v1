name: Flutter Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations (fa/zh/ru/tr + en/ar)
        run: flutter gen-l10n

      - name: Run Analyze
        run: |
          flutter analyze 2>&1 | tee analysis_report.txt || true

      - name: Build Release APK with obfuscation
        run: |
          # v1.0.4+5: build with --obfuscate --split-debug-info for security
          flutter build apk --release --obfuscate --split-debug-info=build/symbols 2>&1 | tee build_log.txt
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "APK built successfully with obfuscation!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Debug Symbols (for crash deobfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols/

      - name: Deploy APK to eCardo Server
        continue-on-error: true
        env:
          ECARDO_DEPLOY_SECRET: ${{ secrets.ECARDO_DEPLOY_SECRET }}
        run: |
          if [ -z "$ECARDO_DEPLOY_SECRET" ]; then
            echo "Skipping deployment because ECARDO_DEPLOY_SECRET is unavailable."
            exit 0
          fi

          # Extract version from pubspec.yaml (e.g. 1.0.4+5 -> 1.0.4)
          VERSION=$(grep -oP "^version:\s*\K[0-9.]+" pubspec.yaml || echo "1.0.0")
          echo "Deploying version $VERSION"
          
          curl --fail-with-body --show-error --silent \
            -X POST https://ecardo.ir/api/user/github-deploy-webhook \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -F "secret=$ECARDO_DEPLOY_SECRET" \
            -F "app_type=user" \
            -F "version=$VERSION" \
            -F "apk=@build/app/outputs/flutter-apk/app-release.apk"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          if-no-files-found: warn
          path: |
            build_log.txt
            analysis_report.txt
