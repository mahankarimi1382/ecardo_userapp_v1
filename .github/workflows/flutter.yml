name: Flutter Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run Analyze
        run: |
          flutter analyze 2>&1 | tee analysis_report.txt || true

      # ==========================================================================
      # Release keystore setup
      # --------------------------------------------------------------------------
      # Decodes the base64-encoded keystore from GitHub Secrets into the project
      # and writes `key.properties` so that build.gradle.kts picks up the
      # production signing config. Falls back to debug signing if the secret
      # is missing (e.g. forked repo without secrets configured).
      # ==========================================================================
      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "⚠️  SIGNING_KEYSTORE_BASE64 secret is not set — falling back to debug signing."
            echo "This is fine for testing but release APKs will not be installable over existing installs."
            exit 0
          fi

          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > android/ecardo-release.keystore
          cat > android/key.properties <<EOF
          storeFile=ecardo-release.keystore
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF
          echo "✅ Release keystore configured."
          ls -la android/ecardo-release.keystore

      - name: Build Release APK
        run: |
          flutter build apk --release 2>&1 | tee build_log.txt
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "APK built successfully!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Deploy APK to eCardo Server
        continue-on-error: true
        env:
          ECARDO_DEPLOY_SECRET: ${{ secrets.ECARDO_DEPLOY_SECRET }}
        run: |
          if [ -z "$ECARDO_DEPLOY_SECRET" ]; then
            echo "⚠️  ECARDO_DEPLOY_SECRET is not set — skipping deploy step."
            exit 0
          fi

          VERSION=$(grep -oP "^version:\s*\K[0-9.]+" pubspec.yaml || echo "1.0.0")
          echo "Deploying version $VERSION"

          curl --fail-with-body --show-error --silent \
            -X POST https://ecardo.ir/api/user/github-deploy-webhook \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -F "secret=$ECARDO_DEPLOY_SECRET" \
            -F "app_type=user" \
            -F "version=$VERSION" \
            -F "apk=@build/app/outputs/flutter-apk/app-release.apk" \
            2>&1 | tee deploy-result.txt || true

          if grep -q "Successfully deployed" deploy-result.txt; then
            echo "APK deployed successfully"
          else
            echo "APK deployment may have failed — check deploy-result.txt"
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          if-no-files-found: warn
          path: |
            build_log.txt
            analysis_report.txt
            deploy-result.txt
