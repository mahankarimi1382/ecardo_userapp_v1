name: Flutter Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run Analyze
        run: |
          flutter analyze 2>&1 | tee analysis_report.txt || true

      - name: Build Release APK
        run: |
          flutter build apk --release 2>&1 | tee build_log.txt
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "APK built successfully!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Deploy APK to eCardo Server
        continue-on-error: true
        env:
          ECARDO_DEPLOY_SECRET: 'ecardo_secret_deploy_key_2026'
        run: |
          VERSION=$(grep -oP "^version:\s*\K[0-9.]+" pubspec.yaml || echo "1.0.0")
          echo "Deploying version $VERSION"

          curl --fail-with-body --show-error --silent \
            -X POST https://ecardo.ir/api/user/github-deploy-webhook \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -F "secret=$ECARDO_DEPLOY_SECRET" \
            -F "app_type=user" \
            -F "version=$VERSION" \
            -F "apk=@build/app/outputs/flutter-apk/app-release.apk" \
            2>&1 | tee deploy-result.txt || true

          if grep -q "Successfully deployed" deploy-result.txt; then
            echo "APK deployed successfully"
          else
            echo "APK deployment may have failed — check deploy-result.txt"
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          if-no-files-found: warn
          path: |
            build_log.txt
            analysis_report.txt
            deploy-result.txt
