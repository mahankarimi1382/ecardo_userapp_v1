<!DOCTYPE html>
<html>
<head>
  <base href="./">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="eCardo - Digital Wallet (Multicountry/KYC)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="eCardo">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>eCardo Wallet</title>
  <style>
    html, body { margin:0; padding:0; height:100%; width:100%; background:#7445FF; overflow:hidden; }
    body { display:flex; align-items:center; justify-content:center; font-family: sans-serif; color:white; flex-direction:column; }
    .loader { width:50px; height:50px; border:4px solid rgba(255,255,255,.3); border-top:4px solid #fff; border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
    .loading-text { margin-top:20px; font-size:14px; opacity:0.9; }
    .center { text-align:center; }
  </style>
</head>
<body>
  <div class="center">
    <div class="loader"></div>
    <div class="loading-text">Loading eCardo Wallet...</div>
  </div>
  <script>
    // Flutter web entrypoint — compatible with Flutter 3.x
    var serviceWorkerVersion = null;
    var scriptLoaded = false;
    function loadMainDartJs() {
      if (scriptLoaded) return;
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }
    window.addEventListener('load', function(ev) {
      loadMainDartJs();
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('flutter-first-frame', function () {
        // navigator.serviceWorker.register('flutter_service_worker.js');
      });
    }
  </script>
</body>
</html>
